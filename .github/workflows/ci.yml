name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --disable-pip-version-check .
      - name: Stress tests, invariants and tooling
        run: python3 tests/run_tests.py -v

  model:
    name: Validate the reference models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # observations are checked against history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check .
      - name: examples/ecommerce
        run: |
          traceos validate examples/ecommerce \
            --repo-files examples/ecommerce/repo-files.txt
      - name: examples/traceos-itself — TraceOS modelling TraceOS
        run: |
          git ls-files '*.py' '*.md' '*.json' \
            | grep -v '^examples/traceos-itself/' > /tmp/repo-files.txt
          traceos validate examples/traceos-itself \
            --repo-files /tmp/repo-files.txt --repo .
      - name: Every evidence locator must point at something that exists
        run: python3 -m traceos.check_locators examples/traceos-itself
      - name: The Pages site renders
        run: python3 -m traceos.site --out /tmp/site --repo .
      - name: A changed file must be modelled, and decay must be discharged
        run: |
          git diff --name-only origin/main...HEAD > /tmp/changed.txt || \
            git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
          traceos ratchet examples/traceos-itself \
            --changed-from /tmp/changed.txt --scope traceos/ \
            --decay-scope traceos/ --decay-scope tests/ --decay-scope docs/ \
            --decay-scope skills/ --decay-baseline 0 --repo .

  lint:
    name: Lint and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check ruff jsonschema pyyaml
      - name: ruff
        run: ruff check traceos tests
      - name: ruff format
        run: ruff format --check traceos tests
      - name: JSON Schema is itself valid
        run: |
          python3 - <<'PY'
          import json, jsonschema
          s = json.load(open("traceos/schema/traceos.schema.json"))
          jsonschema.Draft202012Validator.check_schema(s)
          print("schema ok")
          PY

  coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check coverage .
      # Reported, never gated. A ratchet set before anyone has seen the figure
      # encodes whatever the code happened to do that week (#7).
      - name: The suite, plus the commands CI actually runs
        run: |
          cov() { python3 -m coverage run --branch --parallel-mode --source=traceos "$@"; }
          cov tests/run_tests.py
          cov -m traceos.check_docs
          cov -m traceos.check_locators examples/traceos-itself
          cov -m traceos.site --out /tmp/cov-site --repo .
          cov -m traceos.cli validate examples/ecommerce \
            --repo-files examples/ecommerce/repo-files.txt
          cov -m traceos.cli validate examples/traceos-itself --repo .
          cov -m traceos.cli resolve examples/ecommerce --context tenant=a
          cov -m traceos.cli impact examples/ecommerce \
            --changed src/refund/RefundService.ts
          cov -m traceos.cli coverage examples/ecommerce \
            --repo-files examples/ecommerce/repo-files.txt
          cov -m traceos.cli explore examples/ecommerce --out /tmp/cov.html
          python3 -m coverage combine
          python3 -m coverage report --show-missing --skip-covered
          python3 -m coverage report >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check pyyaml
      - name: Every invariant is defined, cited and enforced
        run: python3 -m traceos.check_docs
